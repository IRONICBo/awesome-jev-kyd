# Weekly refresh of the repository facts in catalog.json — stars, licences and
# archive status — from the GitHub API.
#
# Opens a pull request rather than pushing to main. The bot only ever touches
# facts a machine can check; summaries, notes, patterns and question_types are
# human judgements and a PR keeps a person in the loop on anything surprising,
# such as a repository that stopped resolving.
#
# Permissions note: this is the one workflow here that is not read-only. It
# needs `contents: write` to push its branch and `pull-requests: write` to open
# the PR. It writes nowhere except that branch.
#
# Injection review: no `github.event.*` value reaches a `run:` block. The PR
# body is read from a file the script wrote, never interpolated into a shell.
name: metadata

on:
  schedule:
    # Wednesdays 06:00 UTC, clear of the link sweep (Mon) and claims (Tue).
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Re-read stars, licences and archive status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/refresh_metadata.py --write | tee /tmp/report.txt

      - name: Regenerate anything that embeds those numbers
        run: |
          python3 scripts/build_readme.py
          python3 scripts/build_assets.py
          python3 scripts/lint.py

      - name: Open a pull request when something moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "nothing changed"
            exit 0
          fi

          branch="metadata/refresh-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add catalog.json README.md README.zh-CN.md docs/assets
          git commit -m "chore: refresh repository metadata from the GitHub API"
          git push -u origin "$branch" --force

          {
            echo "Stars, licences and archive status re-read from the GitHub API."
            echo
            echo "The bot touches only machine-checkable facts. Summaries, notes,"
            echo "patterns and question_types are untouched."
            echo
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } > /tmp/body.md

          # A fresh clone or a fork has no labels, and a missing label must not
          # fail a job whose real work already landed.
          gh label create metadata --color 1f6feb \
            --description "Automated refresh of repository facts" 2>/dev/null || true

          existing=$(gh pr list --head "$branch" --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --title "chore: weekly metadata refresh" \
              --body-file /tmp/body.md --label metadata \
              || gh pr create --title "chore: weekly metadata refresh" \
                   --body-file /tmp/body.md
          fi
