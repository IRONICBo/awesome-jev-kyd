<svg xmlns="http://www.w3.org/2000/svg" width="660" height="214" viewBox="0 0 660 214" role="img" aria-label="一次请求返回什么">
<style>.t{font:600 15px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#e6edf3}.g{font:17px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#3fb950}.n{font:600 14px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#e6edf3}.d{font:11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}.w{font:11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f85149}.k{font:11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#6e7681}</style>
<text x="12" y="21" class="t">一次请求返回什么</text>
<text x="12" y="40" class="k">一个 state，多个 question —— 并行求值</text>
<rect x="12" y="58" width="206" height="128" rx="3" fill="none" stroke="#30363d"/>
<rect x="12" y="58" width="206" height="2" fill="#3fb950"/>
<text x="26" y="90" class="g">◆</text>
<text x="26" y="116" class="n">choice</text>
<text x="26" y="140" class="d">≤255 选项中的 1 个</text>
<text x="26" y="162" class="d">+ 概率分布、置信度</text>
<rect x="233" y="58" width="206" height="128" rx="3" fill="none" stroke="#30363d"/>
<rect x="233" y="58" width="206" height="2" fill="#3fb950"/>
<text x="247" y="90" class="g">▮</text>
<text x="247" y="116" class="n">score</text>
<text x="247" y="140" class="d">2–10 个有序级别</text>
<text x="247" y="162" class="d">+ 图例、概率、置信度</text>
<rect x="454" y="58" width="206" height="128" rx="3" fill="none" stroke="#30363d"/>
<rect x="454" y="58" width="206" height="2" fill="#f85149"/>
<text x="468" y="90" class="g">◐</text>
<text x="468" y="116" class="n">noul</text>
<text x="468" y="140" class="d">0–1 概率</text>
<text x="468" y="162" class="w">不带 confidence 字段</text>
</svg>