<svg xmlns="http://www.w3.org/2000/svg" width="660" height="214" viewBox="0 0 660 214" role="img" aria-label="What one request returns">
<style>.t{font:600 15px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#1f2328}.g{font:17px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#1a7f37}.n{font:600 14px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#1f2328}.d{font:11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e}.w{font:11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#cf222e}.k{font:11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#818b98}</style>
<text x="12" y="21" class="t">What one request returns</text>
<text x="12" y="40" class="k">one state, many questions — evaluated in parallel</text>
<rect x="12" y="58" width="206" height="128" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="12" y="58" width="206" height="2" fill="#1a7f37"/>
<text x="26" y="90" class="g">◆</text>
<text x="26" y="116" class="n">choice</text>
<text x="26" y="140" class="d">1 of ≤255</text>
<text x="26" y="162" class="d">+ probabilities, confidence</text>
<rect x="233" y="58" width="206" height="128" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="233" y="58" width="206" height="2" fill="#1a7f37"/>
<text x="247" y="90" class="g">▮</text>
<text x="247" y="116" class="n">score</text>
<text x="247" y="140" class="d">2–10 levels</text>
<text x="247" y="162" class="d">+ legend, probabilities, confidence</text>
<rect x="454" y="58" width="206" height="128" rx="3" fill="none" stroke="#d1d9e0"/>
<rect x="454" y="58" width="206" height="2" fill="#cf222e"/>
<text x="468" y="90" class="g">◐</text>
<text x="468" y="116" class="n">noul</text>
<text x="468" y="140" class="d">0–1 probability</text>
<text x="468" y="162" class="w">no confidence field</text>
</svg>