<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — awesome-jev</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0b0d10;--fg:#e8eaed;--fg-2:#9aa4b1;--fg-3:#6b7684;--amber:#f5a524;--rule:#242b34;
        --mono:"IBM Plex Mono",ui-monospace,monospace;--sans:"IBM Plex Sans",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0}
  body{background:var(--ink);color:var(--fg);font:15px/1.65 var(--sans);min-height:100vh;
       display:grid;place-items:center;padding:32px;text-align:center;
       background-image:linear-gradient(to right,rgba(255,255,255,.022) 1px,transparent 1px),
                        linear-gradient(to bottom,rgba(255,255,255,.022) 1px,transparent 1px);
       background-size:44px 44px}
  .code{font-family:var(--mono);font-size:clamp(56px,14vw,120px);font-weight:600;letter-spacing:-.06em;line-height:1;color:var(--amber)}
  h1{font-family:var(--mono);font-size:clamp(17px,3vw,22px);font-weight:500;margin:14px 0 0;letter-spacing:-.02em}
  p{color:var(--fg-2);max-width:52ch;margin:14px auto 0}
  .links{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:26px;font:12.5px var(--mono)}
  a{color:var(--amber);text-decoration:none}
  a:hover{text-decoration:underline;text-underline-offset:3px}
  code{font-family:var(--mono);font-size:.9em;color:var(--fg)}
  .hint{margin-top:22px;font:12px var(--mono);color:var(--fg-3)}
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>No such page</h1>
    <p>This site is a single page. Entries are addressed by their catalog slug on the
       catalogue view, and the two reference views live behind query parameters.</p>
    <div class="links">
      <a href="./">Catalogue</a>
      <a href="./?view=prims">Primitives</a>
      <a href="./?view=compat">Compatibility</a>
      <a href="https://github.com/kydlikebtc/awesome-jev">GitHub ↗</a>
    </div>
    <p class="hint">Looking for one entry? <code>./#&lt;slug&gt;</code> — the slugs are in <a href="./catalog.json">catalog.json</a>.</p>
  </div>
</body>
</html>
